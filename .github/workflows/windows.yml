# Builds cs2translate.exe for Windows 10/11 on every push, checks that it starts,
# and attaches it to a GitHub release when a version tag (v…) is pushed.
name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-test (chat parsing, Steam paths, config)
        run: python cs2translate.py --self-test

      - name: Build cs2translate.exe
        run: |
          pip install pyinstaller==6.11.1
          pyinstaller --onefile --noconsole --name cs2translate cs2translate.py

      - name: Start it and take screenshots
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$name.png")
          }
          $p = Start-Process dist\cs2translate.exe -ArgumentList "--settings" -PassThru
          Start-Sleep 8; Shot "settings"
          if ($p.HasExited) { throw "settings window exited early (code $($p.ExitCode))" }
          Stop-Process $p
          $q = Start-Process dist\cs2translate.exe -ArgumentList "--test" -PassThru
          Start-Sleep 8; Shot "overlay"
          if ($q.HasExited) { throw "overlay exited early (code $($q.ExitCode))" }
          Stop-Process $q

      - name: Share screenshots (manual runs only, for the dev check)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-screenshots
          git rm -rfq --cached .
          git add settings.png overlay.png
          git commit -qm "screenshots"
          git push -f origin ci-screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: cs2translate-windows
          path: |
            dist/cs2translate.exe
            settings.png
            overlay.png

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/cs2translate.exe
