# Builds cs2translate.exe for Windows 10/11 on every push, checks that it starts,
# and attaches it to a GitHub release when a version tag (v…) is pushed.
name: Build & test

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-test (chat parsing, Steam paths, config)
        run: python cs2translate.py --self-test

      - name: Build cs2translate.exe
        run: |
          pip install pyinstaller==6.11.1
          pyinstaller --onefile --noconsole --name cs2translate cs2translate.py

      - name: Start it and take screenshots
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$name.png")
          }
          $p = Start-Process dist\cs2translate.exe -ArgumentList "--settings" -PassThru
          Start-Sleep 8; Shot "settings"
          if ($p.HasExited) { throw "settings window exited early (code $($p.ExitCode))" }
          Stop-Process $p
          $q = Start-Process dist\cs2translate.exe -ArgumentList "--test" -PassThru
          Start-Sleep 8; Shot "overlay"
          if ($q.HasExited) { throw "overlay exited early (code $($q.ExitCode))" }
          Stop-Process $q

      - name: Share screenshots (manual runs only, for the dev check)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-screenshots
          git rm -rfq --cached .
          git add settings.png overlay.png
          git commit -qm "screenshots"
          git push -f origin ci-screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: cs2translate-windows
          path: |
            dist/cs2translate.exe
            settings.png
            overlay.png

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/cs2translate.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tk + virtual display
        run: sudo apt-get update -q && sudo apt-get install -yq python3-tk xvfb x11-apps imagemagick
      - name: Self-test
        run: python3 cs2translate.py --self-test
      - name: Overlay stays up, shows chat, hides when empty
        run: |
          printf 'L 10/16/2026 - 20:00:00: [ALL] Ivan: привет всем\n' > console.log
          Xvfb :99 -screen 0 1280x720x24 & sleep 2
          export DISPLAY=:99
          python3 cs2translate.py --log console.log --history 5 --duration 6 > out.log 2>&1 &
          PID=$!
          sleep 3; import -window root shown.png
          printf 'L 10/16/2026 - 20:00:05: [CT] Ana: rush b\n' >> console.log
          sleep 12; import -window root hidden.png
          kill -0 $PID || { cat out.log; exit 1; }
          kill $PID; cat out.log
      - name: Share screenshots (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git fetch -q origin ci-screenshots || true
          git checkout -q --orphan linux-shots
          git rm -rfq --cached .
          git add shown.png hidden.png out.log
          git commit -qm "linux screenshots"
          git push -qf origin linux-shots:ci-screenshots-linux
