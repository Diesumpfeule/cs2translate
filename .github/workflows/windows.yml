# Builds cs2translate.exe for Windows 10/11 on every push, checks that it starts,
# and attaches it to a GitHub release when a version tag (v…) is pushed.
name: Build & test

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this tag, e.g. v1.1.0 (empty = just build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-test (chat parsing, Steam paths, config)
        run: python cs2translate.py --self-test

      - name: Build cs2translate.exe
        run: |
          pip install pyinstaller==6.11.1
          pyinstaller --onefile --noconsole --name cs2translate cs2translate.py

      - name: Start it and take screenshots
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$name.png")
          }
          $p = Start-Process dist\cs2translate.exe -ArgumentList "--settings" -PassThru
          Start-Sleep 8; Shot "settings"
          if ($p.HasExited) { throw "settings window exited early (code $($p.ExitCode))" }
          Stop-Process $p
          $q = Start-Process dist\cs2translate.exe -ArgumentList "--test" -PassThru
          Start-Sleep 8; Shot "overlay"
          if ($q.HasExited) { throw "overlay exited early (code $($q.ExitCode))" }
          Stop-Process $q

      - name: Share screenshots (manual runs only, for the dev check)
        if: github.event_name == 'workflow_dispatch' && inputs.release == ''
        shell: pwsh
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-screenshots
          git rm -rfq --cached .
          git add settings.png overlay.png
          git commit -qm "screenshots"
          git push -f origin ci-screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: cs2translate-windows
          path: |
            dist/cs2translate.exe
            settings.png
            overlay.png

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          name: cs2translate ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body: |
            **Windows 10/11:** download `cs2translate.exe`, set `-condebug` in Steam, double-click it once.
            **Linux:** see the README (Wayland overlay via gtk-layer-shell, X11/Tk fallback).
            Proof of concept, written by Claude (Anthropic) – no warranty.
          files: dist/cs2translate.exe

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tk, GTK layer shell, headless Sway
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq python3-tk python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-gtklayershell-0.1 \
            sway grim xvfb x11-apps imagemagick fonts-dejavu
      - name: Self-test
        run: python3 cs2translate.py --self-test
      - name: X11 overlay (Tk) – stays up, hides when empty
        run: |
          printf 'L 10/16/2026 - 20:00:00: [ALL] Ivan: привет всем\n' > console.log
          Xvfb :99 -screen 0 1280x720x24 & sleep 2
          DISPLAY=:99 python3 cs2translate.py --log console.log --duration 6 > x11.log 2>&1 &
          PID=$!
          sleep 4; DISPLAY=:99 import -window root x11-shown.png
          sleep 10; DISPLAY=:99 import -window root x11-hidden.png
          printf 'L 10/16/2026 - 20:00:30: [T] Bob: wir gehen mitte\n' >> console.log
          sleep 4; DISPLAY=:99 import -window root x11-again.png
          kill -0 $PID || { cat x11.log; exit 1; }
          kill $PID; cat x11.log
      - name: Wayland overlay (layer shell on headless Sway) – see-through, hides when empty
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d); chmod 700 $XDG_RUNTIME_DIR
          printf 'output HEADLESS-1 resolution 1280x720\noutput * bg #3a6ea5 solid_color\n' > sway.cfg
          WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1 sway -c sway.cfg > sway.log 2>&1 &
          sleep 3
          export WAYLAND_DISPLAY=$(ls $XDG_RUNTIME_DIR | grep -m1 '^wayland-[0-9]$')
          printf 'L 10/16/2026 - 20:00:00: [CT] Ana: rush b bitte\n' > console2.log
          python3 cs2translate.py --log console2.log --duration 8 > wl.log 2>&1 &
          PID=$!
          sleep 4; grim wl-shown.png
          sleep 12; grim wl-hidden.png
          printf 'L 10/16/2026 - 20:00:30: [T] Bob: wir gehen mitte\n' >> console2.log
          sleep 4; grim wl-again.png
          kill -0 $PID || { cat wl.log; cat sway.log | tail -20; exit 1; }
          kill $PID; cat wl.log
      - name: Share screenshots (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.release == ''
        run: |
          mkdir /tmp/shots && cp *.png *.log /tmp/shots/
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout -q --orphan linux-shots
          git rm -rfq --cached . >/dev/null
          git clean -fdxq
          cp /tmp/shots/* .
          git add *.png *.log
          git commit -qm "linux screenshots"
          git push -qf origin HEAD:refs/heads/ci-screenshots-linux
